<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
<title id="t">Featured projects dashboard</title><desc id="d">Two projects: API Monitoring Dashboard and Developer Snippet Manager.</desc>
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1222"/><stop offset="1" stop-color="#171A35"/></linearGradient><linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123B69"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient><linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#31205D"/><stop offset="1" stop-color="#142A44"/></linearGradient></defs>
<rect width="1200" height="380" rx="20" fill="url(#b)" stroke="#263654"/>
<text x="42" y="43" font-family="monospace" font-size="13" letter-spacing="3" fill="#7DD3FC">03 / SELECTED WORK</text>
<text x="42" y="79" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#F1F5F9">Projects built to solve real problems</text>
