 <text x="22" y="78" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">API Monitoring Dashboard</text>
 <text x="22" y="107" font-family="Arial,sans-serif" font-size="15" fill="#C7D8F4">Monitor API health, detect downtime and recovery,</text><text x="22" y="129" font-family="Arial,sans-serif" font-size="15" fill="#C7D8F4">and inspect logs and uptime analytics.</text>
 <g font-family="monospace" font-size="12" fill="#DBEAFE"><rect x="22" y="151" width="72" height="27" rx="6" fill="#1D4ED8" fill-opacity=".7"/><text x="58" y="169" text-anchor="middle">Python</text><rect x="102" y="151" width="82" height="27" rx="6" fill="#14532D"/><text x="143" y="169" text-anchor="middle">Django</text><rect x="192" y="151" width="78" height="27" rx="6" fill="#7F1D1D"/><text x="231" y="169" text-anchor="middle">Celery</text><rect x="278" y="151" width="70" height="27" rx="6" fill="#7F1D1D"/><text x="313" y="169" text-anchor="middle">Redis</text></g>
 <text x="22" y="207" font-family="monospace" font-size="12" fill="#93C5FD">API HEALTH  /  LOGS  /  UPTIME ANALYTICS</text>
</g>
<g transform="translate(616 105)">
 <rect width="542" height="230" rx="15" fill="url(#p2)" stroke="#8B5CF6" stroke-opacity=".7"/>
 <rect x="22" y="20" width="64" height="24" rx="6" fill="#7C3AED"/><text x="54" y="36" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">PROJECT 02</text>
 <text x="22" y="78" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#F8FAFC">Developer Snippet Manager</text>
 <text x="22" y="107" font-family="Arial,sans-serif" font-size="15" fill="#D7CCF7">Save, search, organize, favorite, and share</text><text x="22" y="129" font-family="Arial,sans-serif" font-size="15" fill="#D7CCF7">reusable code snippets in one workspace.</text>
 <g font-family="monospace" font-size="12" fill="#EDE9FE"><rect x="22" y="151" width="72" height="27" rx="6" fill="#1D4ED8" fill-opacity=".7"/><text x="58" y="169" text-anchor="middle">Python</text><rect x="102" y="151" width="82" height="27" rx="6" fill="#14532D"/><text x="143" y="169" text-anchor="middle">Django</text><rect x="192" y="151" width="78" height="27" rx="6" fill="#164E63"/><text x="231" y="169" text-anchor="middle">SQLite</text><rect x="278" y="151" width="100" height="27" rx="6" fill="#713F12"/><text x="328" y="169" text-anchor="middle">JavaScript</text></g>
 <text x="22" y="207" font-family="monospace" font-size="12" fill="#C4B5FD">CRUD  /  SEARCH  /  SHARING  /  JSON API</text>
