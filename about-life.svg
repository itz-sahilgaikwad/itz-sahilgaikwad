<text x="42" y="88" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#F1F5F9">Curious mind. Practical builder.</text>
<text x="42" y="125" font-family="Arial, sans-serif" font-size="17" fill="#B8C5DF">I'm a CSE student at Sandip University, Nashik, interested in backend systems,</text>
<text x="42" y="151" font-family="Arial, sans-serif" font-size="17" fill="#B8C5DF">APIs, databases, and developer tools. I learn by building, debugging, and improving.</text>
